<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini ejercicios CSS-grid</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!--1. grid 2x2-->
    <div id="grid2x2">
        <div>hola</div>
        <div>mundo</div>
        <div>bonito</div>
        <div>mueranse</div>
    </div>

    <br>
    <br>


    <!--2. grid 3x3 con un elemento ocupando 2 columnas-->
    <div id="grid3x3-elemento2col">
        <div>hola</div>
        <div>mundo</div>
        <div id="elemento2col">bonito</div>
        <div>no se mueran</div>
    </div>

    
    <br>
    <br>

    <!--3. grid layout con template-area-->
    <div id="grid-layout-area">
        <div class="header">hola</div>
        <div class="main">mundo</div>
        <div class="sidebar">horrible</div>
        <div class="footer">sobrevivan</div>
    </div>

    
    <br>
    <br>
    <br>
    <br>

    <!--4. centrar div con grid y flexbox-->
    <div id="centrado-grid">
        <div>centrado con grid</div>
    </div>
    <div id="centrado-flexbox">
        <div>centrado con flexbox</div>
    </div>

    <br>
    <br>

    <!--5. grid-responsive con auto-fit-->
    <div id="grid-responsive">
        <div>hola</div>
        <div>mundo</div>
        <div>horrible</div>
        <div>jodanse</div>
    </div>

</body>
</html>
