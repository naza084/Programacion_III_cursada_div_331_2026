<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./css/selectores.css"></link>
</head>
<body>
    
    <!--
    Necesito estar en el formulario para las validaciones
    
    TODAS LAS VALIDACIONES HECHAS EN EL HTML SON PURAMENTE VISUALES
    LAS VALIDACIONES REALES SON EN EL BACK
    -->

    <form action="">
        <div>
            <label for="firstName">Nombre: </label>
            <input 
                type="text" 
                id="firstName" 
                name="firstName" 
                required 
                maxlength="20" 
                minlength="2"
            >
        </div>

        <div>
            <label for="Email">Email: </label>
            <input type="email" id="Email" name="Email" required minlength="8">
        </div>
        <div>
            <label for="Age"> Edad: </label>
            <input type="number" id="Age" name="Age" min="18" max="99">
        </div>
        <div>
            <label for="stat">Calificación: </label>
            <input type="range" id="stat" name="stat" min="0" max="10">
        </div>
        <div>
            <label for="Password">Password: </label>
            <input type="password" id="Password" name="Password" min="0" max="10" required minlength="8"
            autocomplete="new-password">
        </div>

        <!--Necesito el boton para enviar el formulario-->
        <button id="submit">Enviar</button>
    </form>


</body>
</html>
