<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer contacto</title>
</head>
<body>
    
    <h1 
        align="center"
        onclick="console.log('Hola mundo')"
        style="height: 50px;"
    >
        Hola mundo
    </h1>


    <!--RUTAS-->

    <!--Ruta absoluta-->
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/67/UTN_logo.jpg?utm_source=es.wikipedia.org&utm_campaign=parser&utm_content=thumbnail_unscaled"/>

    <!--Ruta relativa-->
    <img src="../Clase 1/img/image.png"/>


    <!--ANCLAS-->
    <a href="https://www.google.com">Google</a>


    <!--Etiquetas semanticas-->
    <header>
        <h1>Bienvenido a mi sitio web</h1>
    </header>

    <main>
        <p>Este es el contenido principal de mi sitio web.</p>
    </main>

    <footer>
        <p>&copy; 2023 Mi Sitio Web. Todos los derechos reservados.</p>
    </footer>



    <!--Etiquetas no sémanticas de texto-->
    <b>texto</b>
    <i>texto</i>
    <u>texto</u>

    <!--Etiquetas semanticas de texto-->
    <strong>texto</strong>
    <em>texto</em>
    <mark>texto</mark>
    <p>texto</p>
    <pre>texto</pre>
    <cite>texto</cite>
    <abbr title="texto">Texto abreviado</abbr>



    <!--Vista de pagina en miniatura-->
    <iframe src="index.html"></iframe>


    <!--FORMULARIOS-->

    <form>
        <!--tipos de inputs-->
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Nombre">
        <br> <!-- si el ID del input y el for del label coinciden, 
        se puede hacer clic en el label para escribir en el input-->

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Email">
        <br>

        <input type="checkbox" name="terminos" id="terminos">
        <label for="terminos">Acepto los términos y condiciones</label>
        <br>

        <input type="color" name="color" placeholder="Color">
        <input type="url" name="url" placeholder="URL">
        <input type="password" name="password" placeholder="Contraseña">
        <input type="number" name="edad" placeholder="Edad">
        <input type="date" name="fecha" placeholder="Fecha">
        <input type="radio" name="genero" value="masculino"> Masculino
        <input type="radio" name="genero" value="femenino"> Femenino
        <input type="submit" value="Enviar">
        <input type="file" name="archivo" placeholder="Seleccionar archivo">

    </form>

</body>

<script>
    console.log('Hola mundo de html desde js')
</script>
</html>
