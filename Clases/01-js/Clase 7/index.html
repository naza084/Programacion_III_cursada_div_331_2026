<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM aplicado</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>
    
    <Form id="formulario">
        <div>
            <label for="username">Username</label>
            <input type="text" name="username" id="username" placeholder="acá va tu nombre"/>
            <!--los valores del atributo name aparecen en la URL, lo mismo con Password-->
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="1234" />
        </div>
        <button id="registrarse">Registrarse</button>
    </Form>

    <script src="./Main.js"></script>

</body>
</html>
